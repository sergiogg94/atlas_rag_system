[project]
name = "atlas-rag-system"
version = "0.1.0"
description = "Develpment of my own RAG System"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "colorlog>=6.10.1",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
backend = [
    "asyncpg>=0.31.0",
    "fastapi>=0.135.3",
    "langchain-text-splitters>=1.1.2",
    "numpy>=2.4.4",
    "openai>=2.36.0",
    "pgvector>=0.4.2",
    "pymupdf>=1.27.2.2",
    "python-multipart>=0.0.26",
    "sentence-transformers>=5.7.0",
    "sqlalchemy>=2.0.49",
    "torch>=2.13.0",
    "uvicorn>=0.44.0",
    "voyageai>=0.3.7",
]
frontend = [
    "gradio>=6.14.0",
    "httpx>=0.28.1",
]
dashboard = [
    "langchain-text-splitters>=1.1.2",
    "numpy>=2.4.4",
    "openai>=2.36.0",
    "pandas>=3.0.0",
    "plotly>=6.7.0",
    "scikit-learn>=1.8.0",
    "streamlit>=1.57.0",
    "voyageai>=0.3.7",
]

[dependency-groups]
dev = [
    "isort>=8.0.1",
    "pytest>=9.0.3",
]

# CPU-only torch to avoid pulling ~3.8GB of CUDA/nvidia wheels in containers.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
